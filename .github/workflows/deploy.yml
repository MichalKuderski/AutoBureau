name: Deploy

# Deployment is separate from `ci.yml` on purpose: CI answers "is this commit correct?",
# and must keep answering that for forks and for commits nobody intends to ship. This
# workflow answers "does this commit become a running deployment?", which needs secrets
# and an approval gate. Merging them would hand deployment credentials to every PR run.
#
# GitHub Actions is the single deployment authority — `vercel.json` sets
# `github.enabled: false` so Vercel's own Git integration cannot also deploy. Two
# triggers would mean a push could reach production without passing the gates below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]
      stage:
        description: >-
          `migrate` applies migrations and stops in staging or production. In production, D-4 — granting
          app_user LOGIN, which no automated path performs — happens before a build is
          shipped against a database it cannot reach. `deploy` then builds and ships. `all`
          fuses both and is only correct once app_user can already log in.
        required: false
        default: all
        type: choice
        options: [all, migrate, deploy]

concurrency:
  # Never two deployments to the same target at once; a queued production deploy that
  # overtakes its predecessor is how a rollback gets silently undone.
  group: deploy-${{ github.ref }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── preview ────────────────────────────────────────────────────────────────────────
  # Every PR gets a real deployment and the same smoke suite production gets. A preview
  # that is never asserted against is decoration.
  preview:
    name: preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@latest

      # `VERCEL_STAGING_PROJECT_ID`, not `VERCEL_PROJECT_ID`. §9.3 puts preview on the
      # staging backend, and the Doppler config that carries the staging `AUTH_*` and
      # `DATABASE_URL` values syncs into the staging Vercel project's Preview scope — so
      # pulling the production project's preview scope found nothing and every preview
      # answered 503 at the boundary, with the Doppler sync reporting "In Sync" the whole
      # time because it was in sync with a project this job never deployed to.
      #
      # It also put every pull-request preview inside the production Vercel project, one
      # scope away from production's own configuration. Wrong on both counts, and only the
      # first one was visible.
      - name: Pull Vercel preview configuration
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      # Advisory, and `continue-on-error` is the honest setting rather than a concession:
      # variables marked Sensitive in Vercel are write-only, so `vercel pull` returns them
      # unreadable and this step CANNOT validate them. Gating a deploy on a check that is
      # blind to its own subject would block every deployment for no finding. It reports
      # what it can see and never fails the run.
      - name: Inspect the pulled preview configuration (advisory)
        continue-on-error: true
        run: node scripts/inspect-preview-config.mjs

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        id: deploy
        # The URL is written to the step output, never echoed with the token beside it.
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      # Deployment Protection answers ahead of the deployment, so the smoke suite has to
      # identify itself as automation or it never reaches the application at all. The
      # secret bypasses the gate for this request only; the preview URL stays private.
      - name: Smoke the preview
        run: node scripts/smoke-deployment.mjs "${{ steps.deploy.outputs.url }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # The smoke suite deliberately never signs anyone in, so it cannot see the half of
      # the system that only exists once someone does: the household bootstrap, tenant
      # isolation, session rotation, and the limiter. This drives those against the real
      # provider and the real staging database, which is the only place they are true.
      #
      # It writes synthetic identities to staging on every preview — doc 09 §1 already
      # fixes staging as synthetic-only, and a bootstrap asserted against a mock would
      # prove nothing about the deployment. It never touches production: this job is the
      # only caller and it only ever has a preview URL.
      - name: Staging acceptance against the preview
        run: node scripts/staging-acceptance.mjs "${{ steps.deploy.outputs.url }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Read redacted Preview auth diagnostics after a failure
        if: failure() && steps.deploy.outputs.url != ''
        continue-on-error: true
        run: node scripts/preview-auth-diagnostics.mjs "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

  # ── staging ────────────────────────────────────────────────────────────────────────
  # Migrations run before the code that depends on them, and staging is where a
  # migration is proved. Deploy order is always: migrate (expand) → deploy (doc 09 §4).
  staging:
    name: staging
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Direct connection, not the pooled one: `migrate deploy` takes advisory locks and
      # issues DDL, and transaction-mode pooling breaks both.
      - name: Apply migrations (expand)
        if: github.event.inputs.stage != 'deploy'
        run: |
          node scripts/verify-staging-migration-target.mjs
          pnpm --filter @autobureau/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}

      - if: github.event.inputs.stage != 'migrate'
        run: npm install --global vercel@latest

      # No `--git-branch`. Vercel accepts it only alongside `--environment=preview`, because
      # branch overrides exist only in the preview scope; pairing it with `production`
      # is refused outright:
      #
      #     Invalid request: `target` must be "preview" when specifying a `gitBranch`
      #
      # `production` is nonetheless the right scope here. Staging deploys with `--prod`
      # into the *staging* Vercel project (doc 09 §9.3), so the configuration it needs is
      # that project's production scope — the log confirms the right project was reached,
      # `autobureau-staging`, and only the flag combination was rejected.
      #
      # This had never executed before: the staging job runs only on a push to `main` or a
      # dispatch, and every previous attempt died at the migration step above it. The two
      # sibling `vercel pull` calls were always correct — preview passes
      # `--environment=preview` with no branch, production passes neither.
      - name: Pull Vercel staging configuration
        if: github.event.inputs.stage != 'migrate'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      - name: Build
        if: github.event.inputs.stage != 'migrate'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        if: github.event.inputs.stage != 'migrate'
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      # `vars.STAGING_HOST`, not the per-deployment URL this job just produced.
      #
      # The deployment URL and `APP_ORIGIN` are different origins here, and the CSRF check
      # compares against `APP_ORIGIN`. Staging deploys with `--prod`, so `VERCEL_ENV` is
      # `production` and `APP_ORIGIN` is the stable domain rather than something derived
      # per deployment — §9.3 provides that derivation only for `preview`. Smoking the
      # deployment URL therefore sends an Origin the application is right to reject, and
      # `POST /v1/auth/sign-in` answered 403 before reaching the provider. The suite still
      # scored 17/17, because its assertions there are "never 200" and "not 503" and a
      # CSRF refusal satisfies both — a green run that had not exercised the boundary.
      #
      # Pointing both steps at the stable domain makes the Origin match, which is what lets
      # the acceptance suite below sign anyone in at all. `--prod` promotes this deployment
      # to that domain, so it is the same artifact either way.
      - name: Smoke staging
        if: github.event.inputs.stage != 'migrate'
        run: node scripts/smoke-deployment.mjs "https://${{ vars.STAGING_HOST }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # Staging's counterpart to the preview job's acceptance run, and the reason the host
      # above has to be right: this signs real synthetic identities in and out, and every
      # state-changing request it makes carries an Origin the CSRF check must accept.
      #
      # Synthetic identities only, against the staging backend doc 09 §1 already fixes as
      # synthetic-only. It never touches production: this job only ever holds a staging host.
      - name: Staging acceptance against the deployment
        if: github.event.inputs.stage != 'migrate'
        run: node scripts/staging-acceptance.mjs "https://${{ vars.STAGING_HOST }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  # ── production · stage 1 of 2: migrate ─────────────────────────────────────────────
  # Gated by a GitHub protected environment: the approval is the promotion. Production is
  # never deployed by a push alone — a human names the commit that ships (doc 09 §2/§4).
  #
  # Migration and deploy are separate dispatches, and the reason is not cosmetic.
  # `20260728000001_rls` creates `app_user` NOLOGIN — deliberately, because a password in a
  # version-controlled migration would be a password in the repository. Until somebody runs,
  # once per environment (runbook D-4):
  #
  #     ALTER ROLE app_user WITH LOGIN PASSWORD '…';
  #     GRANT CONNECT ON DATABASE postgres TO app_user;
  #
  # the runtime `DATABASE_URL` cannot authenticate no matter how correctly it is formed.
  # Fused into one job, the deploy would ship a build whose database is unreachable — and
  # the smoke suite would still score 17/17, because the rate limiter fails open (ADR-013),
  # so a database nothing can reach changes no HTTP status the suite looks at. The green
  # score would be indistinguishable from a healthy deployment.
  #
  # Splitting the stages puts a human decision where that failure would otherwise be
  # silent: migrate, perform D-4, verify the role, then deploy.
  production_migrate:
    name: production · migrate
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.environment == 'production'
      && contains(fromJSON('["all", "migrate"]'), github.event.inputs.stage)
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # First, and before anything mutates — for the same reason it guards the deploy
      # stage: an unset `PRODUCTION_HOST` fails the smoke there, and a failed smoke rolls
      # production back. Checked here too so a two-stage cutover cannot migrate against a
      # configuration that is already doomed to roll back two dispatches later.
      - name: Require PRODUCTION_HOST before anything mutates
        run: |
          if [ -z "${{ vars.PRODUCTION_HOST }}" ]; then
            echo "::error::vars.PRODUCTION_HOST is unset. Refusing to migrate production:"
            echo "::error::the deploy stage smokes that host, and would fail and roll back."
            exit 1
          fi
          echo "PRODUCTION_HOST is set."

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations (expand)
        run: pnpm --filter @autobureau/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}

      - name: What has to happen before the deploy stage
        run: |
          echo "Migrations applied. app_user now exists, and cannot log in yet."
          echo
          echo "Before dispatching stage 2 (environment=production, stage=deploy):"
          echo "  D-2  verify _prisma_migrations: 6 rows, all finished, none rolled back"
          echo "  D-3  verify RLS enabled and policies present on the tenant tables"
          echo "  D-4  ALTER ROLE app_user WITH LOGIN PASSWORD '<the password already in DATABASE_URL>';"
          echo "       GRANT CONNECT ON DATABASE postgres TO app_user;"
          echo "  D-5  verify app_user is not superuser, has no BYPASSRLS, and owns no tables"
          echo
          echo "Deploying without D-4 produces a 17/17 smoke against an unreachable database."

  # ── production · stage 2 of 2: build and deploy ────────────────────────────────────
  # Runs after the migrate stage in a fused `all` dispatch, or on its own once D-4 has
  # been performed and verified. `skipped` is accepted as a predecessor result precisely so
  # the `deploy` stage can be dispatched by itself.
  production_deploy:
    name: production · deploy
    needs: [production_migrate]
    if: >-
      !cancelled()
      && github.event_name == 'workflow_dispatch'
      && github.event.inputs.environment == 'production'
      && contains(fromJSON('["all", "deploy"]'), github.event.inputs.stage)
      && (needs.production_migrate.result == 'success' || needs.production_migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # Pointing the smoke below at `PRODUCTION_HOST` gives that variable teeth it did not
      # have: unset, it used to cost only the proof that a rollback landed, but now it would
      # fail the primary smoke — and a failed smoke rolls production back. An unset variable
      # would therefore roll back a deployment that was never shown to be bad.
      #
      # So it is checked here, ahead of the deploy, where the cost of being wrong is a red
      # job that changed nothing. A public hostname is not a credential (§9.4), but there is
      # no reason to echo it, so this reports only whether it is set.
      - name: Require PRODUCTION_HOST before anything mutates
        run: |
          if [ -z "${{ vars.PRODUCTION_HOST }}" ]; then
            echo "::error::vars.PRODUCTION_HOST is unset. Refusing to deploy production:"
            echo "::error::the post-deploy smoke targets that host, and would fail and trigger a rollback."
            exit 1
          fi
          echo "PRODUCTION_HOST is set."

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # `vars.PRODUCTION_HOST`, for the reason staging now does the same: `APP_ORIGIN` here
      # is the stable host, the CSRF check compares against it, and a deployment URL is a
      # different origin. Smoking the deployment URL sends an Origin the application is
      # right to reject, so `POST /v1/auth/sign-in` answers 403 without reaching the
      # provider — and the suite still scores 17/17, because a refusal satisfies both of its
      # assertions there ("never 200", "not 503"). Staging demonstrated exactly this: the
      # same check read 403 against the deployment URL and 401 against the stable origin.
      #
      # `vercel deploy --prebuilt --prod` aliases this deployment onto that host before the
      # CLI returns, so this smokes the artifact just deployed, not the previous one. It
      # also makes the rollback verification below an apples-to-apples repeat of this step:
      # same origin, before and after the pointer moves.
      #
      # There is deliberately NO production acceptance step. `staging-acceptance.mjs` proves
      # the auth stack by *creating* identities, households and rate-limit rows; doc 09 §1
      # fixes staging as synthetic-only precisely so that is safe there. Running it against
      # production would write synthetic accounts into real user data and consume real
      # sign-up limits. Production's equivalent is a human check against a known account,
      # which belongs in the cutover runbook rather than in this job.
      - name: Smoke production
        run: node scripts/smoke-deployment.mjs "https://${{ vars.PRODUCTION_HOST }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # A failed smoke is a failed deployment, and the response is immediate: the previous
      # production deployment is promoted back. This is Vercel's own instant rollback
      # (doc 09 §4) — a pointer move between immutable deployments, not a rebuild — so it
      # touches no schema and needs no migration to be reversed.
      - name: Roll back on smoke failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error::Production smoke failed — rolling back to the previous deployment."
          vercel rollback --yes --token="$VERCEL_TOKEN"
          node scripts/smoke-deployment.mjs "https://${{ vars.PRODUCTION_HOST }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
