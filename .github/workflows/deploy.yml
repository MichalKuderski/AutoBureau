name: Deploy

# Deployment is separate from `ci.yml` on purpose: CI answers "is this commit correct?",
# and must keep answering that for forks and for commits nobody intends to ship. This
# workflow answers "does this commit become a running deployment?", which needs secrets
# and an approval gate. Merging them would hand deployment credentials to every PR run.
#
# GitHub Actions is the single deployment authority — `vercel.json` sets
# `github.enabled: false` so Vercel's own Git integration cannot also deploy. Two
# triggers would mean a push could reach production without passing the gates below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  # Never two deployments to the same target at once; a queued production deploy that
  # overtakes its predecessor is how a rollback gets silently undone.
  group: deploy-${{ github.ref }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── preview ────────────────────────────────────────────────────────────────────────
  # Every PR gets a real deployment and the same smoke suite production gets. A preview
  # that is never asserted against is decoration.
  preview:
    name: preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@latest

      # `VERCEL_STAGING_PROJECT_ID`, not `VERCEL_PROJECT_ID`. §9.3 puts preview on the
      # staging backend, and the Doppler config that carries the staging `AUTH_*` and
      # `DATABASE_URL` values syncs into the staging Vercel project's Preview scope — so
      # pulling the production project's preview scope found nothing and every preview
      # answered 503 at the boundary, with the Doppler sync reporting "In Sync" the whole
      # time because it was in sync with a project this job never deployed to.
      #
      # It also put every pull-request preview inside the production Vercel project, one
      # scope away from production's own configuration. Wrong on both counts, and only the
      # first one was visible.
      - name: Pull Vercel preview configuration
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      # Advisory, and `continue-on-error` is the honest setting rather than a concession:
      # variables marked Sensitive in Vercel are write-only, so `vercel pull` returns them
      # unreadable and this step CANNOT validate them. Gating a deploy on a check that is
      # blind to its own subject would block every deployment for no finding. It reports
      # what it can see and never fails the run.
      - name: Inspect the pulled preview configuration (advisory)
        continue-on-error: true
        run: node scripts/inspect-preview-config.mjs

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        id: deploy
        # The URL is written to the step output, never echoed with the token beside it.
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      # Deployment Protection answers ahead of the deployment, so the smoke suite has to
      # identify itself as automation or it never reaches the application at all. The
      # secret bypasses the gate for this request only; the preview URL stays private.
      - name: Smoke the preview
        run: node scripts/smoke-deployment.mjs "${{ steps.deploy.outputs.url }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # The smoke suite deliberately never signs anyone in, so it cannot see the half of
      # the system that only exists once someone does: the household bootstrap, tenant
      # isolation, session rotation, and the limiter. This drives those against the real
      # provider and the real staging database, which is the only place they are true.
      #
      # It writes synthetic identities to staging on every preview — doc 09 §1 already
      # fixes staging as synthetic-only, and a bootstrap asserted against a mock would
      # prove nothing about the deployment. It never touches production: this job is the
      # only caller and it only ever has a preview URL.
      - name: Staging acceptance against the preview
        run: node scripts/staging-acceptance.mjs "${{ steps.deploy.outputs.url }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  # ── staging ────────────────────────────────────────────────────────────────────────
  # Migrations run before the code that depends on them, and staging is where a
  # migration is proved. Deploy order is always: migrate (expand) → deploy (doc 09 §4).
  staging:
    name: staging
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Direct connection, not the pooled one: `migrate deploy` takes advisory locks and
      # issues DDL, and transaction-mode pooling breaks both.
      - name: Apply migrations (expand)
        run: pnpm --filter @autobureau/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}

      - run: npm install --global vercel@latest

      - name: Pull Vercel staging configuration
        run: vercel pull --yes --environment=production --git-branch=main --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      - name: Smoke staging
        run: node scripts/smoke-deployment.mjs "${{ steps.deploy.outputs.url }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  # ── production ─────────────────────────────────────────────────────────────────────
  # Gated by a GitHub protected environment: the approval is the promotion. Production is
  # never deployed by a push alone — a human names the commit that ships (doc 09 §2/§4).
  production:
    name: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations (expand)
        run: pnpm --filter @autobureau/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}

      - run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke production
        run: node scripts/smoke-deployment.mjs "${{ steps.deploy.outputs.url }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # A failed smoke is a failed deployment, and the response is immediate: the previous
      # production deployment is promoted back. This is Vercel's own instant rollback
      # (doc 09 §4) — a pointer move between immutable deployments, not a rebuild — so it
      # touches no schema and needs no migration to be reversed.
      - name: Roll back on smoke failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error::Production smoke failed — rolling back to the previous deployment."
          vercel rollback --yes --token="$VERCEL_TOKEN"
          node scripts/smoke-deployment.mjs "https://${{ vars.PRODUCTION_HOST }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
