name: Verify production configuration (TEMPORARY)

# TEMPORARY — pre-cutover verification. Delete once production configuration is settled.
#
# A SEPARATE workflow, deliberately, and that is the safety property. `deploy.yml`'s only
# manual trigger takes a required `environment` choice, so dispatching it to reach a
# diagnostic would also satisfy a deploy job's `if` — dispatching it as `production` would
# deploy production. This file has no such input and no deploy step, so running it cannot
# migrate, build, deploy, or promote anything.
#
# It binds NO `environment:` either. That keeps it clear of the production environment's
# approval gate and branch policy, and means nothing here consumes a production approval.
#
# What it establishes, none of which can be seen from outside a runner:
#   · the structure of `PRODUCTION_MIGRATION_DATABASE_URL`, and whether its username carries
#     the production project ref rather than staging's — without connecting to the database;
#   · which Vercel project `VERCEL_PROJECT_ID` actually resolves to, printed by the CLI as
#     `<org>/<project>` — the question a hostname alone cannot answer;
#   · which variable NAMES arrived in that project's Production scope, and which Supabase
#     project the auth URLs name.
#
# `vercel pull` is read-only: it downloads configuration into the ephemeral runner and
# deploys nothing. No value is printed — see scripts/inspect-production-config.mjs for what
# it refuses to print and why.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify production configuration (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No connection is opened. The string is decomposed and described.
      - name: Migration credential — structure only
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: node scripts/inspect-production-config.mjs migration-secret

      - run: npm install --global vercel@latest

      # The CLI names the project it resolved to, which is what settles whether
      # `VERCEL_PROJECT_ID` points at production or at staging.
      - name: Which Vercel project does VERCEL_PROJECT_ID resolve to?
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Which names arrived in the Production scope?
        run: node scripts/inspect-production-config.mjs pulled-scope
