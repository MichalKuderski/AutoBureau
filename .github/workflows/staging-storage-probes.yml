name: Native staging ADR-016 storage probes
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: adr016-stable-staging-proof
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'MichalKuderski/AutoBureau'
      && github.event.pull_request.number == 5
      && github.event.label.name == 'adr016-storage-probes'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref == 'codex/launch-foundations'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@59.16.0
      - name: Probe native staging scopes without stable promotion
        run: node scripts/staging-storage-provider-proof.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_STAGING_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-storage-provider-proof
          path: staging-storage-provider-proof.json
          retention-days: 7
