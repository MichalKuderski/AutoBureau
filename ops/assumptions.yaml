# AutoBureau — Assumption Registry (machine-readable source of truth)
#
# This file, not the markdown ledger, is authoritative. `ops/assumption-ledger.md`
# holds the updating rules and narrative; the dashboard renders from here.
#
# UPDATING (FOUNDING_PRINCIPLES §10):
#   evidence_class hierarchy, strongest first:
#     behavioral  — we watched them do it
#     paid        — they gave us money
#     stated      — they told us they would
#     expert      — a panel/advisor/model judged it
#     secondary   — desk research, competitor signals, precedent
#     prior       — our own reasoning, no external input
#   Disconfirming evidence moves confidence further than confirming evidence of
#   equal weight. `n` travels with every entry. Anecdotes (n<3) move nothing,
#   except trust/accuracy failures, which are signal at n=1 by design.
#
# STATUS VOCABULARY:
#   untested  — no primary evidence yet
#   testing   — an experiment is live
#   supported — evidence favors it; not yet load-bearing-proven
#   weakened  — evidence runs against it; still open
#   refuted   — decided against; roadmap consequence recorded
#   retired   — no longer decision-relevant

