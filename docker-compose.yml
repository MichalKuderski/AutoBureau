# Local development infrastructure only — production runs Supabase + Upstash (doc 01 §5).
services:
  postgres:
    image: pgvector/pgvector:pg16
    # Bound to the IPv4 loopback explicitly, and on a port chosen to be unlikely to
    # collide. A bare "54329:5432" publishes on the wildcard address only; any host
    # postgres holding the *specific* loopback addresses on the same port wins every
    # `localhost` connection, silently, because a specific bind beats a wildcard one.
    # That happened here: a stray PG18 instance shadowed this container for a whole
    # session and the integration suite was scoring green against the wrong server.
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: autobureau
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: autobureau
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobureau"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:63790:6379"]

volumes:
  pgdata:
